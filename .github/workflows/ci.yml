name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      # check = unit tests (JUnit 5 + Robolectric), payload-vs-schema tests, fault injection,
      # Android lint, and checkFootprint (AAR < 100 KB, no third-party runtime dependencies).
      - name: Check
        run: ./gradlew check :sample-app:assembleDebug
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-reports
          path: android/**/build/reports/
