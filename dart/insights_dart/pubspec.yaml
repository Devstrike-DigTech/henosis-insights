name: insights_dart
description: >-
  Henosis Insights client for Dart and Flutter SDKs. Integration telemetry for SDK vendors with no
  end-user data. Pure Dart: no Flutter or plugin dependency, works on mobile, web, desktop and server.
version: 0.1.0
repository: https://github.com/Devstrike-DigTech/henosis-insights/tree/main/dart/insights_dart
issue_tracker: https://github.com/Devstrike-DigTech/henosis-insights/issues
topics: [telemetry, sdk, privacy]

environment:
  sdk: ^3.6.0

# No runtime dependencies: dart:io HttpClient on native, fetch via dart:js_interop on the web.
dependencies: {}

dev_dependencies:
  json_schema: ^5.2.2
  lints: ^6.1.0
  stream_channel: ^2.1.4
  test: ^1.33.0
