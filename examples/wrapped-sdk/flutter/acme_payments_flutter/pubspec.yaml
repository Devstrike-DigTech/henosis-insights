name: acme_payments_flutter
description: Flutter wrapper of the fictional Acme Payments Android SDK. Shows Henosis Insights bridged mode (M4).
version: 2.0.3
publish_to: none

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  insights_dart:
    path: ../../../../dart/insights_dart

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.acme.acme_payments_flutter
        pluginClass: AcmePaymentsFlutterPlugin
